name: Build AI Study Buddy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract app project
        run: |
          mkdir app_project
          unzip -q -o AIStudyBuddy_GitHub_Ready.zip -d app_project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: |
          cd app_project
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Study-Buddy-APK
          path: app_project/app/build/outputs/apk/debug/app-debug.apk
